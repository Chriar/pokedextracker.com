name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - web/**
      - .github/workflows/android-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Build offline web bundle
        working-directory: web
        env:
          LOCAL_APP: '1'
          NODE_ENV: production
        run: yarn build

      - name: Generate Android project
        working-directory: web
        run: npx cap add android && npx cap sync android

      - name: Generate app icons
        working-directory: web
        run: npx capacitor-assets generate --android

      - name: Build APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp web/android/app/build/outputs/apk/debug/app-debug.apk pokedextracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pokedextracker-apk
          path: pokedextracker.apk

      # Keep a fixed release updated with the latest APK so it can be
      # downloaded and installed straight from a phone's browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: Android APK (latest)
          prerelease: true
          files: pokedextracker.apk
          body: |
            Latest offline Android build. Download `pokedextracker.apk` on your
            phone, open it, and allow installing from your browser when asked.
            All data stays on-device (no account, no server).
